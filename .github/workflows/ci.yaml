name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: Tests (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        homeassistant: ["2026.3.0", "2026.11.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install "homeassistant==${{ matrix.homeassistant }}" -r requirements-test.txt ruff
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check .
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  release:
    needs: [tests, hassfest, hacs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish version from manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import json; print(json.load(open("custom_components/rostov_vodokanal/manifest.json"))["version"])')
          if gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "v${version}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v${version}" --notes-file CHANGELOG.md
